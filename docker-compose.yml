services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synthetic_lab
      POSTGRES_USER: synthetic
      POSTGRES_PASSWORD: synthetic_dev_only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://synthetic:synthetic_dev_only@postgres:5432/synthetic_lab
      REDIS_URL: redis://redis:6379
      TRUECALLER_ENABLED: "false"
      FACEBOOK_DEMO_ENABLED: "true"
    depends_on: [postgres, redis]
    ports: ["3000:3000"]
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://synthetic:synthetic_dev_only@postgres:5432/synthetic_lab
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
volumes:
  postgres_data:
